name: pipeline CI c++

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      -  uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          cmake \
          ninja-build \
          g++ \
          gcovr
      
      - name: configure cmake
        run: |
          cmake -S . -B build -G Ninja -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: build cmake
        run: |
          cmake --build build
      
      - name: testing
        working-directory: build/tests
        run: ctest --output-on-failure
      
      - name: generate coverage
        run: |
          gcovr \
            --root . \
            --html-details coverage.html \
            --exclude '.*googletest.*'  \
            --exclude external  \
            --xml coverage.xml \
            --fail-under-line 90

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.html
            coverage/